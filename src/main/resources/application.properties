spring.application.name=mibodeguita-api-gateway

server.port=8090
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=security-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://security-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/security-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://inventory-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/inventory-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=movement-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://movement-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/movement-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}
