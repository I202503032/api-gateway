spring.application.name=api-gateway
server.port=8070

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Autenticacion: primero se deriva al servicio de seguridad
spring.cloud.gateway.server.webflux.routes[0].id=security-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://security-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Movimientos: ruta especifica antes de la ruta general de productos
spring.cloud.gateway.server.webflux.routes[1].id=product-movements
spring.cloud.gateway.server.webflux.routes[1].uri=lb://movement-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/*/movimiento

# Exportaciones: deben llegar al servicio de movimientos
spring.cloud.gateway.server.webflux.routes[2].id=product-export
spring.cloud.gateway.server.webflux.routes[2].uri=lb://movement-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/productos/exportar,/api/productos/exportar/**

# CRUD general de productos: servicio de inventario
spring.cloud.gateway.server.webflux.routes[3].id=product-inventory
spring.cloud.gateway.server.webflux.routes[3].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/productos/**
# CORS para permitir peticiones desde Angular
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
# Eliminar cabeceras CORS duplicadas
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
